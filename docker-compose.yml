services:
  # Local development Postgres (pgvector). Production uses Neon — set
  # DATABASE_URL in .env and start with: docker compose --profile app up.
  postgres:
    profiles: ["dev"]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: gnosis
      POSTGRES_PASSWORD: gnosis
      POSTGRES_DB: gnosis
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gnosis"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Redis for BullMQ queues (needed in every environment).
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The API + workers. Requires a reachable DATABASE_URL (Neon in
  # production; the dev postgres above for local use).
  app:
    profiles: ["app"]
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Inside compose, Redis is always the bundled service.
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
